# =============================================================================
# Yazi theme — generated by aibox CLI from the active theme palette
# Docs: https://yazi-rs.github.io/docs/configuration/theme
# =============================================================================

[mgr]
cwd = { fg = "#D65D0E" }
hovered = { fg = "#FBF1C7", bg = "#3C3836" }
preview_hovered = { bg = "#EBDBB2", underline = true }
find_keyword = { fg = "#B57614", bold = true }
find_position = { fg = "#D03A17", italic = true }
marker_selected = { fg = "#79740E", bg = "#79740E" }
marker_copied = { fg = "#D65D0E", bg = "#D65D0E" }
marker_cut = { fg = "#CC241D", bg = "#CC241D" }

[tabs]
active = { fg = "#FBF1C7", bg = "#D65D0E", bold = true }
inactive = { fg = "#928374", bg = "#EBDBB2" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#FBF1C7", bg = "#79740E", bold = true }
normal_alt = { fg = "#79740E", bg = "#EBDBB2", bold = true }
select_main = { fg = "#FBF1C7", bg = "#D65D0E", bold = true }
select_alt = { fg = "#D65D0E", bg = "#EBDBB2", bold = true }
unset_main = { fg = "#FBF1C7", bg = "#D03A17", bold = true }
unset_alt = { fg = "#D03A17", bg = "#EBDBB2", bold = true }

[status]
overall = { fg = "#3C3836", bg = "#EBDBB2" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_type = { fg = "#D65D0E" }
perm_read = { fg = "#B57614" }
perm_write = { fg = "#CC241D" }
perm_exec = { fg = "#79740E" }
perm_sep = { fg = "#928374" }
progress_label = { fg = "#3C3836", bold = true }
progress_normal = { fg = "#D65D0E", bg = "#EBDBB2" }
progress_error = { fg = "#CC241D", bg = "#EBDBB2" }

[input]
border = { fg = "#D65D0E" }
title = { fg = "#D65D0E", bg = "#FBF1C7", bold = true }
value = { fg = "#3C3836", bg = "#FBF1C7" }
selected = { reversed = true }

[pick]
border = { fg = "#D65D0E" }
active = { fg = "#D03A17" }
inactive = { fg = "#928374", bg = "#FBF1C7" }

[cmp]
border = { fg = "#D65D0E" }
active = { fg = "#D03A17" }
inactive = { fg = "#928374", bg = "#FBF1C7" }

[tasks]
border = { fg = "#D65D0E" }
title = { fg = "#D65D0E", bg = "#FBF1C7", bold = true }
hovered = { bg = "#EBDBB2", underline = true }

[which]
mask = { bg = "#EBDBB2" }
cand = { fg = "#076678" }
rest = { fg = "#928374" }
desc = { fg = "#D03A17" }
separator = "  "
separator_style = { fg = "#928374" }

[help]
on = { fg = "#076678" }
run = { fg = "#D03A17" }
desc = { fg = "#3C3836", bg = "#FBF1C7" }
hovered = { bg = "#EBDBB2", bold = true }
footer = { fg = "#FBF1C7", bg = "#3C3836" }

[git]
modified = { fg = "#B57614" }
untracked = { fg = "#D03A17" }
added = { fg = "#79740E" }
deleted = { fg = "#CC241D" }
updated = { fg = "#D65D0E" }
ignored = { fg = "#928374" }

[filetype]
rules = [
    { url = "*/", fg = "#D65D0E", bold = true },
    { url = "*.rs", fg = "#D65D0E" },
    { url = "*.py", fg = "#B57614" },
    { url = "*.js", fg = "#B57614" },
    { url = "*.ts", fg = "#D65D0E" },
    { url = "*.sh", fg = "#79740E" },
    { url = "*.toml", fg = "#076678" },
    { url = "*.yaml", fg = "#076678" },
    { url = "*.yml", fg = "#076678" },
    { url = "*.json", fg = "#076678" },
    { url = "*.kdl", fg = "#076678" },
    { url = "*.html", fg = "#D65D0E" },
    { url = "*.css", fg = "#D65D0E" },
    { url = "*.md", fg = "#3C3836" },
    { url = "*.tex", fg = "#79740E" },
    { url = "*.typ", fg = "#79740E" },
    { url = "*.pdf", fg = "#CC241D" },
    { url = "*.png", fg = "#D03A17" },
    { url = "*.jpg", fg = "#D03A17" },
    { url = "*.jpeg", fg = "#D03A17" },
    { url = "*.gif", fg = "#D03A17" },
    { url = "*.svg", fg = "#D03A17" },
    { url = "*.zip", fg = "#D65D0E" },
    { url = "*.tar*", fg = "#D65D0E" },
    { url = "*.gz", fg = "#D65D0E" },
    { url = "*.gitignore", fg = "#928374" },
    { url = ".env*", fg = "#CC241D" },
    { url = "Dockerfile*", fg = "#D65D0E" },
    { url = "Makefile", fg = "#79740E" },
    { url = "Cargo.toml", fg = "#D65D0E", bold = true },
    { url = "Cargo.lock", fg = "#928374" },
]
