# =============================================================================
# Yazi theme — generated by aibox CLI from the active theme palette
# Docs: https://yazi-rs.github.io/docs/configuration/theme
# =============================================================================

[mgr]
cwd = { fg = "#AF3A03" }
hovered = { fg = "#000000", bg = "#E9C598", bold = true }
preview_hovered = { fg = "#000000", bg = "#E9C598", bold = true }
find_keyword = { fg = "#946110", bold = true }
find_position = { fg = "#8F3F71" }
marker_selected = { fg = "#746F0D", bg = "#746F0D" }
marker_copied = { fg = "#8F3F71", bg = "#8F3F71" }
marker_cut = { fg = "#9D0006", bg = "#9D0006" }

[indicator]
parent = { fg = "#786B5F" }
current = { fg = "#AF3A03", bg = "#AF3A03", bold = true }
preview = { fg = "#417956" }
padding = { open = "▐", close = "▌" }

[tabs]
active = { fg = "#FFFFFF", bg = "#AF3A03", bold = true }
inactive = { fg = "#786B5F", bg = "#E6DDB7", dim = true }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#FFFFFF", bg = "#746F0D", bold = true }
normal_alt = { fg = "#746F0D", bg = "#E6DDB7", bold = true }
select_main = { fg = "#FFFFFF", bg = "#AF3A03", bold = true }
select_alt = { fg = "#AF3A03", bg = "#E6DDB7", bold = true }
unset_main = { fg = "#FFFFFF", bg = "#8F3F71", bold = true }
unset_alt = { fg = "#8F3F71", bg = "#E6DDB7", bold = true }

[status]
overall = { fg = "#3C3836", bg = "#E6DDB7" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_type = { fg = "#AF3A03" }
perm_read = { fg = "#946110" }
perm_write = { fg = "#9D0006" }
perm_exec = { fg = "#746F0D" }
perm_sep = { fg = "#786B5F" }
progress_label = { fg = "#3C3836", bold = true }
progress_normal = { fg = "#AF3A03", bg = "#E6DDB7" }
progress_error = { fg = "#9D0006", bg = "#E6DDB7", bold = true }

[input]
border = { fg = "#AF3A03" }
title = { fg = "#AF3A03", bg = "#FBF1C7", bold = true }
value = { fg = "#3C3836", bg = "#FBF1C7" }
selected = { fg = "#000000", bg = "#E9C598" }

[pick]
border = { fg = "#AF3A03" }
active = { fg = "#8F3F71" }
inactive = { fg = "#786B5F", bg = "#FBF1C7" }

[cmp]
border = { fg = "#AF3A03" }
active = { fg = "#8F3F71" }
inactive = { fg = "#786B5F", bg = "#FBF1C7" }

[tasks]
border = { fg = "#AF3A03" }
title = { fg = "#AF3A03", bg = "#FBF1C7", bold = true }
hovered = { fg = "#000000", bg = "#E9C598", bold = true }

[which]
mask = { bg = "#E6DDB7" }
cand = { fg = "#417956" }
rest = { fg = "#786B5F" }
desc = { fg = "#8F3F71" }
separator = "  "
separator_style = { fg = "#786B5F" }

[help]
on = { fg = "#417956" }
run = { fg = "#8F3F71" }
desc = { fg = "#3C3836", bg = "#FBF1C7" }
hovered = { fg = "#000000", bg = "#E9C598", bold = true }
footer = { fg = "#FBF1C7", bg = "#3C3836" }

[git]
modified = { fg = "#946110", bold = true }
untracked = { fg = "#8F3F71", italic = true }
added = { fg = "#746F0D" }
deleted = { fg = "#9D0006" }
updated = { fg = "#AF3A03" }
ignored = { fg = "#786B5F", dim = true }

[filetype]
rules = [
    { url = "*/", fg = "#AF3A03", bold = true },
    { url = "*.rs", fg = "#AF3A03" },
    { url = "*.py", fg = "#946110" },
    { url = "*.js", fg = "#946110" },
    { url = "*.ts", fg = "#AF3A03" },
    { url = "*.sh", fg = "#746F0D" },
    { url = "*.toml", fg = "#417956" },
    { url = "*.yaml", fg = "#417956" },
    { url = "*.yml", fg = "#417956" },
    { url = "*.json", fg = "#417956" },
    { url = "*.kdl", fg = "#417956" },
    { url = "*.html", fg = "#AF3A03" },
    { url = "*.css", fg = "#AF3A03" },
    { url = "*.md", fg = "#3C3836" },
    { url = "*.tex", fg = "#746F0D" },
    { url = "*.typ", fg = "#746F0D" },
    { url = "*.pdf", fg = "#9D0006" },
    { url = "*.png", fg = "#8F3F71" },
    { url = "*.jpg", fg = "#8F3F71" },
    { url = "*.jpeg", fg = "#8F3F71" },
    { url = "*.gif", fg = "#8F3F71" },
    { url = "*.svg", fg = "#8F3F71" },
    { url = "*.zip", fg = "#AF3A03" },
    { url = "*.tar*", fg = "#AF3A03" },
    { url = "*.gz", fg = "#AF3A03" },
    { url = "*.gitignore", fg = "#786B5F" },
    { url = ".env*", fg = "#9D0006" },
    { url = "Dockerfile*", fg = "#AF3A03" },
    { url = "Makefile", fg = "#746F0D" },
    { url = "Cargo.toml", fg = "#AF3A03", bold = true },
    { url = "Cargo.lock", fg = "#786B5F" },
]
